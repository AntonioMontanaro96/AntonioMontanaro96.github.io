<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinghio's Jersey Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
  /* Layout: one centered court-floor maze, HUD above, d-pad below. Single dark arcade look by choice. */
  :root {
    --bg: #14110f;
    --floor: #c98a4b;      /* hardwood */
    --floor-line: #b07337;
    --wall: #2b2420;
    --wall-edge: #3d332d;
    --orange: #ff7a1a;     /* basketball */
    --text: #f6eee6;
    --muted: #b8a99b;
    --win: #3fd17a;
    --lose: #ff4d5e;
    --display: "Bungee", "Impact", system-ui, sans-serif;
    --body: "Rubik", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body { margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  h1 {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(1.4rem, 5vw, 2.2rem); margin: 0; letter-spacing: .02em;
    color: var(--orange); text-align: center; text-wrap: balance;
  }
  .hint { margin: 0; color: var(--muted); font-size: .95rem; text-align: center; max-width: 40ch; }
  .hint b { color: var(--text); }

  .court {
    --cols: 9; --rows: 7;
    position: relative;
    width: min(100%, 560px);
    aspect-ratio: 9 / 7;
    max-width: 100%;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: repeat(var(--rows), 1fr);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 4px var(--wall-edge), 0 18px 40px rgba(0,0,0,.5);
  }
  .cell.floor {
    background: repeating-linear-gradient(90deg, var(--floor) 0 22%, var(--floor-line) 22% 23%);
  }
  .cell.wall {
    background: var(--wall);
    box-shadow: inset 0 -3px 0 var(--wall-edge);
  }
  .sprite {
    position: absolute;
    width: calc(100% / 9); height: calc(100% / 7);
    display: grid; place-items: center;
    transition: transform .14s ease-out;
    pointer-events: none;
  }
  .sprite img {
    width: 92%; height: 92%; object-fit: cover; border-radius: 50%;
    border: 3px solid var(--text); box-sizing: border-box; background: var(--wall);
  }
  .sprite.anto img { border-color: var(--win); }
  .sprite.gira img { border-color: var(--lose); }
  .sprite .tag {
    position: absolute; bottom: -2px; font: 600 .62rem/1 var(--body);
    background: var(--bg); color: var(--text); padding: 2px 5px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .player { z-index: 2; }
  .player img { border-color: var(--orange); }
  .jersey {
    position: absolute; right: -4%; bottom: -4%; width: 46%; height: 46%;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  @media (prefers-reduced-motion: reduce) { .sprite { transition: none; } }

  .pad {
    display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px);
    gap: 8px;
  }
  .pad button {
    font: 400 1.4rem var(--display); color: var(--text);
    background: var(--wall); border: 2px solid var(--wall-edge); border-radius: 12px;
    cursor: pointer;
  }
  .pad button:active { background: var(--orange); }
  .pad button:focus-visible, .again:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }

  .overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(20,17,15,.88); text-align: center; padding: 16px;
    animation: pop .25s ease-out;
  }
  .overlay img { width: 28%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 4px solid currentColor; }
  .overlay p {
    margin: 0; font-family: var(--display); font-size: clamp(1.1rem, 5vw, 2rem); line-height: 1.15;
    text-wrap: balance;
  }
  .overlay.win { color: var(--win); }
  .overlay.lose { color: var(--lose); }
  .again {
    font: 600 1rem var(--body); color: var(--bg); background: var(--text);
    border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer;
  }
  @keyframes pop { from { opacity: .4; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .overlay { animation: none; } }
</style>

</head>
<body>
<h1>Cinghio's Jersey Run</h1>
<p class="hint">Cinghio has a basketball jersey to deliver. Bring it to <b>Anto</b>, and watch out for <b>Gira</b>. Use the arrow keys, swipe, or the buttons.</p>

<div class="court" id="court" aria-label="Maze">
  <div class="sprite anto" id="anto"><img src="anto.webp" alt="Anto"><span class="tag">Anto</span></div>
  <div class="sprite gira" id="gira"><img src="gira.png" alt="Gira"><span class="tag">Gira</span></div>
  <div class="sprite player" id="player">
    <img src="cinghio.webp" alt="Cinghio">
    <svg class="jersey" viewBox="0 0 40 44" aria-hidden="true">
      <path d="M10 2h6a4 4 0 0 0 8 0h6l8 8-6 6v26H8V16l-6-6z" fill="#ff7a1a" stroke="#14110f" stroke-width="2"/>
      <text x="20" y="34" text-anchor="middle" font-family="Bungee, Impact, sans-serif" font-size="14" fill="#14110f">23</text>
    </svg>
  </div>
  <div class="overlay" id="overlay" hidden>
    <img id="ovImg" alt="">
    <p id="ovText"></p>
    <button class="again" id="again" type="button">Play again</button>
  </div>
</div>

<div class="pad">
  <button id="up" type="button" aria-label="Up">↑</button>
  <button id="left" type="button" aria-label="Left">←</button>
  <button id="down" type="button" aria-label="Down">↓</button>
  <button id="right" type="button" aria-label="Right">→</button>
</div>

<script>
  // # wall, . floor, S start, A Anto, G Gira
  const MAP = [
    "#########",
    "#...#..G#",
    "#.#.#.###",
    "#.#...#.#",
    "#.###.#.#",
    "#S.....A#",
    "#########",
  ];
  const ROWS = MAP.length, COLS = MAP[0].length;
  const court = document.getElementById('court');
  const player = document.getElementById('player');
  const overlay = document.getElementById('overlay');
  let start, anto, gira, pos, over = false;

  // build cells (inserted before the sprites so sprites sit on top)
  const frag = document.createDocumentFragment();
  MAP.forEach((row, r) => [...row].forEach((ch, c) => {
    const d = document.createElement('div');
    d.className = 'cell ' + (ch === '#' ? 'wall' : 'floor');
    d.style.gridRow = r + 1; d.style.gridColumn = c + 1;
    frag.appendChild(d);
    if (ch === 'S') start = { r, c };
    if (ch === 'A') anto = { r, c };
    if (ch === 'G') gira = { r, c };
  }));
  court.prepend(frag);

  const place = (el, p) => { el.style.transform = `translate(${p.c * 100}%, ${p.r * 100}%)`; };
  place(document.getElementById('anto'), anto);
  place(document.getElementById('gira'), gira);

  function reset() {
    pos = { ...start }; over = false;
    overlay.hidden = true;
    place(player, pos);
  }

  function finish(win) {
    over = true;
    overlay.className = 'overlay ' + (win ? 'win' : 'lose');
    document.getElementById('ovImg').src = win ? 'anto.webp' : 'gira.png';
    document.getElementById('ovText').textContent = win
      ? 'Congrats, you win! Anto got the jersey 🏀'
      : 'Hey looser chiavati Gira';
    overlay.hidden = false;
    document.getElementById('again').focus();
  }

  function move(dr, dc) {
    if (over) return;
    const n = { r: pos.r + dr, c: pos.c + dc };
    if (MAP[n.r]?.[n.c] === undefined || MAP[n.r][n.c] === '#') return;
    pos = n; place(player, pos);
    if (n.r === anto.r && n.c === anto.c) setTimeout(() => finish(true), 160);
    else if (n.r === gira.r && n.c === gira.c) setTimeout(() => finish(false), 160);
  }

  const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
  const KEYS = { ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right' };
  addEventListener('keydown', e => {
    const k = KEYS[e.key] || KEYS[e.key.toLowerCase?.()];
    if (k) { e.preventDefault(); move(...DIRS[k]); }
    else if (over && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); reset(); }
  });
  Object.keys(DIRS).forEach(k => document.getElementById(k).addEventListener('click', () => move(...DIRS[k])));
  document.getElementById('again').addEventListener('click', reset);

  // swipe on the maze
  let t0 = null;
  court.addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
  court.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
    t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1); else move(dy > 0 ? 1 : -1, 0);
  }, { passive: true });

  reset();
</script>
</body>
</html>
